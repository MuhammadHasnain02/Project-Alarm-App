<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Signika:wght@300..700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: "Montserrat", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
        }

        /* Custom animation */
        @keyframes fadeSlideDown {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        .show-menu {
            display: block;
            animation: fadeSlideDown 0.6s ease forwards;
        }

        .hide-menu {
            animation: fadeSlideUp 0.5s ease forwards;
        }
  </style>

</head>

<body class="bg-linear-to-tl from-[#00175B] to-[#FDA693] min-h-screen">

    <audio id="alarmSound" src="preview.mp3" preload="auto"></audio>

    <section class="flex flex-col items-center h-screen justify-center">
        <div class="flex flex-col gap-8 space-x-10 px-14 py-12 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl shadow-md">
            
            <div class="flex flex-row gap-11 text-gray-300 m-0 pb-8 border-b-2">

                <!-- Heading & Current Time -->
                <div class="flex flex-col justify-center">
                    
                    <h2 class="text-[32px] font-extrabold bg-gradient-to-br from-[#c8705c] to-[#0d2f96] bg-clip-text text-transparent drop-shadow-lg tracking-wide">
                        <span class="pl-0">Alarm App</span>
                    </h2>
                    <h2 id="currentTime" class="text-center text-[24px] text-gray-300 font-bold tracking-wider">
                        <span class="pl-0">00:00:00</span>
                    </h2>

                </div>
                <!-- Set Alarm -->
                <div class="flex flex-col space-y-4">

                    <div class="text-gray-200">
                        <input type="time" id="alarmTime"
                        class="px-3 py-2 w-60 text-[17px] font-bold border border-white/30 rounded-lg tracking-widest [color-scheme:dark] hover:cursor-pointer">
                    </div>

                    <button id="setAlarmBtn" 
                    class="bg-linear-to-tl from-[#00175B] to-[#bf7a6a] text-[15px] w-full px-4 py-2 rounded-lg font-semibold text-gray-300 shadow-md transition ease-in-out duration-700 hover:scale-95 hover:cursor-pointer">
                        Set
                    </button>

                </div>

            </div>
                    
            <!-- Alarm List -->
            <div class="w-full space-y-5">

                <h2 class="text-center text-2xl font-bold text-gray-300 drop-shadow-lg">
                    <span class="pl-0">Your Alarms</span>
                </h2>
                <ul id="alarmList" class="text-center space-y-3">

                    <li class="flex justify-between items-center bg-white/10 border border-white/20 px-4 py-2 w-full rounded-lg">
                        <i class="fa-solid fa-plus text-white"></i>
                        <span class="text-lg font-bold text-gray-300">No Alarm</span>
                        <i class="fa-regular fa-alarm-clock text-white"></i>
                    </li>
                    
                </ul>

            </div>

        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
